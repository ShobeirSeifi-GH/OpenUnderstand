[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/student_404131050"]
pythonpath = [
    ".",
    "openunderstand",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: isolated unit tests",
    "integration: parser or database integration tests",
    "generated: tests initially generated by Pynguin",
    "oracle: differential tests against SciTools Understand",
    "slow: tests excluded from the fast CI job",
    "property: property-based tests generated by Hypothesis",
]
norecursedirs = [
    "tests/student_404131050/generated/raw",
]

[tool.coverage.run]
branch = true
source = ["openunderstand.analysis_passes.Throws_ThrowsBy"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2

[tool.coverage.html]
directory = "coverage-reports/html"

[tool.coverage.xml]
output = "coverage-reports/coverage.xml"

[tool.coverage.json]
output = "coverage-reports/coverage.json"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "gen",
    "openunderstand/gen",
    "coverage-reports",
    "mutation-reports",
    "tests/student_404131050/generated/raw",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
files = [
    "tests/student_404131050",
    "scripts",
]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "^gen/",
    "^openunderstand/gen/",
    "^tests/student_404131050/generated/raw/",
]

[[tool.mypy.overrides]]
module = [
    "openunderstand",
    "openunderstand.*",
    "gen",
    "gen.*",
]
follow_imports = "skip"
ignore_errors = true

[tool.mutmut]
source_paths = [
    "openunderstand",
]
only_mutate = [
    "openunderstand/analysis_passes/Throws_ThrowsBy.py",
]
pytest_add_cli_args_test_selection = [
    "tests/student_404131050",
]
pytest_add_cli_args = [
    "-q",
    "-rxX",
    "-p",
    "no:cov",
]
mutate_only_covered_lines = false
max_stack_depth = 8

