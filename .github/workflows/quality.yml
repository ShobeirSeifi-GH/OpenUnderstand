name: OpenUnderstand Test Quality

on:
  push:
    branches:
      - feature/testing-404131050
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type Check, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip check

      - name: Create report directories
        run: |
          mkdir -p coverage-reports/html
          mkdir -p test-reports

      - name: Run Ruff
        run: |
          python -m ruff check tests/student_404131050 scripts

      - name: Run mypy
        run: |
          python -m mypy tests/student_404131050 scripts

      - name: Run tests and collect coverage
        run: |
          python -m pytest tests/student_404131050 \
            --cov=openunderstand.analysis_passes.Throws_ThrowsBy \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html:coverage-reports/html \
            --cov-report=xml:coverage-reports/coverage.xml \
            --cov-report=json:coverage-reports/coverage.json \
            --junitxml=test-reports/junit.xml \
            -v

      - name: Enforce coverage quality gates
        run: |
          python scripts/check_quality_gates.py \
            --report coverage-reports/coverage.json \
            --min-line 80 \
            --min-branch 70

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-python-3.11.9
          path: |
            test-reports/
            coverage-reports/
          if-no-files-found: warn
          retention-days: 14